# Example nginx for the static Profitru-Marketing site (multi-page HTML, not an SPA).
# Copy to the server, adjust root paths and TLS paths, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Common 404 causes:
#   - Only index.html was uploaded (missing blog/, amazon-profit-calculator/, logos/, etc.)
#   - server_name / root points at the wrong directory on this host
#   - Using SPA-style try_files ... /index.html for a static multi-folder site (see below)
#
# SECURITY: Never put .env or .git under the nginx root. Keep secrets in
#   /home/profitru/profitru-marketing/.env (see profitru-marketing.service).
# The deny rules below are a safety net if something is mis-synced.
#
# Add once in nginx http {} block (outside server {}):
#   limit_req_zone $binary_remote_addr zone=profitru_forms:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name profitru.com www.profitru.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/profitru-marketing;
    index index.html;

    # --- Deny secrets, VCS, and backend files (must be before location /) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* ^/(\.env|\.env\..*|\.git)(/|$) {
        deny all;
        return 404;
    }

    location ~* \.(?:env|bak|sql|sqlite3?|pem|key|log)$ {
        deny all;
        return 404;
    }

    location ~* ^/(contact_server|form_security|serve)\.py$ {
        deny all;
        return 404;
    }

    location = /index.html {
        return 301 /;
    }

    location ~ ^(.*/)?index\.html$ {
        return 301 $1;
    }

    location = /README.md {
        deny all;
        return 404;
    }

    location = /requirements.txt {
        deny all;
        return 404;
    }

    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location ^~ /tests/ {
        deny all;
        return 404;
    }

    location ^~ /.venv {
        deny all;
        return 404;
    }

    location ^~ /docs/ {
        deny all;
        return 404;
    }

    location ^~ /scripts/ {
        deny all;
        return 404;
    }

    # Serve real files and directory indexes (blog/index.html, amazon-profit-calculator/index.html, ?)
    location / {
        try_files $uri $uri/ =404;
    }

    # Contact + waitlist form API (run gunicorn on 127.0.0.1:8080)
    # Requires limit_req_zone in http {} ? see comment at top of this file.
    location /api/ {
        limit_req zone=profitru_forms burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Long cache for versioned assets (HTML references use ?v=...)
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Recommended: one canonical host. Redirect the other TLD so you do not maintain two full uploads.
server {
    listen 443 ssl http2;
    server_name profitru.in www.profitru.in;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    return 301 https://profitru.com$request_uri;
}
