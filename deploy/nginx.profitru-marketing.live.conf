# Canonical site (.com)
server {
    listen 443 ssl; # managed by Certbot
    server_name www.profitru.com profitru.com;

    ssl_certificate /etc/letsencrypt/live/www.profitru.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.profitru.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Deny secrets / VCS / backend before proxying to gunicorn
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(?:env|bak|pem|key|log|sqlite3?)$ {
        deny all;
        return 404;
    }

    location ~* ^/(contact_server|form_security|serve)\.py$ {
        deny all;
        return 404;
    }

    location = /README.md {
        deny all;
        return 404;
    }

    location = /requirements.txt {
        deny all;
        return 404;
    }

    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location ^~ /tests/ {
        deny all;
        return 404;
    }

    location ^~ /docs/ {
        deny all;
        return 404;
    }

    location ^~ /scripts/ {
        deny all;
        return 404;
    }

    location = /index.html {
        return 301 /;
    }

    location ~ ^(.*/)?index\.html$ {
        return 301 $1;
    }

    location /api/ {
        # Overwrite client XFF — app trusts X-Real-IP only.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# .in → .com (301)
server {
    listen 443 ssl; # managed by Certbot
    server_name www.profitru.in profitru.in;

    ssl_certificate /etc/letsencrypt/live/www.profitru.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.profitru.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://profitru.com$request_uri;
}

# HTTP → HTTPS .com
server {
    listen 80;
    server_name www.profitru.com profitru.com www.profitru.in profitru.in;
    return 301 https://profitru.com$request_uri;
}
