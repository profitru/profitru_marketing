# Canonical site (.com)
# Apply with: sudo nginx -t && sudo systemctl reload nginx
#
# Also set once in the nginx http {} block (main nginx.conf):
#   server_tokens off;
# (repeated below per-server as a safety net)

server {
    listen 443 ssl; # managed by Certbot
    server_name www.profitru.com profitru.com;

    ssl_certificate /etc/letsencrypt/live/www.profitru.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.profitru.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;

    # Plain 404 body (no "nginx/1.x" fingerprint) for deny rules and missing URIs
    # handled by nginx itself. Proxied Flask 404s are unchanged (no intercept).
    error_page 404 = @plain_not_found;

    location @plain_not_found {
        internal;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        return 404 "Not Found\n";
    }

    # Security headers (always = include error responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Allows GA + Google Fonts + Turnstile + existing inline gtag / onload handlers.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; upgrade-insecure-requests" always;

    # Deny secrets / VCS / backend before proxying to gunicorn
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(?:env|bak|pem|key|log|sqlite3?)$ {
        deny all;
        return 404;
    }

    location ~* ^/(contact_server|form_security|serve)\.py$ {
        deny all;
        return 404;
    }

    location = /README.md {
        deny all;
        return 404;
    }

    location = /requirements.txt {
        deny all;
        return 404;
    }

    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location ^~ /tests/ {
        deny all;
        return 404;
    }

    location ^~ /docs/ {
        deny all;
        return 404;
    }

    location ^~ /scripts/ {
        deny all;
        return 404;
    }

    location = /index.html {
        return 301 /;
    }

    location ~ ^(.*/)?index\.html$ {
        return 301 $1;
    }

    location /api/ {
        # Overwrite client XFF — app trusts X-Real-IP only.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# .in → .com (301)
server {
    listen 443 ssl; # managed by Certbot
    server_name www.profitru.in profitru.in;

    ssl_certificate /etc/letsencrypt/live/www.profitru.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.profitru.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://profitru.com$request_uri;
}

# HTTP → HTTPS .com
server {
    listen 80;
    server_name www.profitru.com profitru.com www.profitru.in profitru.in;
    server_tokens off;
    return 301 https://profitru.com$request_uri;
}
